name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all tools
        run: |
          set -eux
          powerpc-eabi-gcc --version | head -1
          for d in vi_probe vi_pll vi720test chromatest chromatest480 vimodetest; do
            if [ -f "tools/$d/Makefile" ]; then
              echo "=== $d ==="
              make -C "tools/$d"
              ls -l "tools/$d/boot.dol"
            fi
          done
      - name: Stage dols
        run: |
          set -eux
          for d in vi_probe vi_pll vi720test chromatest chromatest480 vimodetest; do
            [ -f "tools/$d/boot.dol" ] || continue
            mkdir -p "dist/apps/$d"
            cp "tools/$d/boot.dol" "dist/apps/$d/"
            [ -f "tools/$d/meta.xml" ] && cp "tools/$d/meta.xml" "dist/apps/$d/" || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wii-vi-apps
          path: dist/**
      # Also publish prebuilt dols to the `dist` branch so they can be fetched over git
      # (handy where the Actions artifact store is not directly reachable).
      - name: Publish dols to dist branch
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          echo "build $(date -u +%Y-%m-%dT%H:%M:%SZ) from ${GITHUB_SHA}" > dist/BUILD_INFO.txt
          cd dist
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "prebuilt dols [skip ci]"
          git branch -M dist
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin dist
