# vi_pll round 3 -- CONFIRM exact HD pixel clocks.
# Put this file (named exactly vi_pll.cfg) in the ROOT of the USB drive, then run the
# SAME vi_pll v2 boot.dol. Its presence replaces the built-in sweep with these tries.
#
# Clock law decoded from run 2:   F = 54 MHz * Nfb / V
#   Nfb = 0x1C4 bits 8-15 (byte1) + 1     (baseline 7)
#   V   = 0x1C8 bits 20-23                (baseline 7)
# byte2 of 0x1C4 stays 0x20 (0x21 hard-hangs); byte0 stays 0xC0 (post-divide = 1).
#
# Lines run top-to-bottom; a hang stops the rest, so the two key confirmations are first.
# Each line is anchored at 1280x240p and auto-restored afterwards.

# === TARGET 1: 74.25 MHz = 54 * 11/8   (Nfb=11 byte1=0x0A, V=8) ===
TRY 1C4=00200AC0 1C8=D880700E

# === TARGET 2: 148.5 MHz = 54 * 22/8   (Nfb=22 byte1=0x15, V=8) ===
TRY 1C4=002015C0 1C8=D880700E

# === TARGET 2 (alt): 148.5 MHz = 54 * 11/4   (Nfb=11, V=4) tests V below baseline ===
TRY 1C4=00200AC0 1C8=D840700E

# === Confirm V (0x1C8 bits 20-23) is a clean linear divider, at base Nfb=7 ===
# V=6 -> predict 63.00 MHz
TRY 1C8=D860700E
# V=5 -> predict 75.60 MHz
TRY 1C8=D850700E
# V=9 -> predict 42.00 MHz
TRY 1C8=D890700E
# V=10 -> predict 37.80 MHz
TRY 1C8=D8A0700E

# === Re-confirm each target knob in isolation (sanity) ===
# Nfb=11 alone (V=7) -> predict 84.86 MHz
TRY 1C4=00200AC0
# V=8 alone (Nfb=7) -> predict 47.25 MHz
TRY 1C8=D880700E
